# ProofGraph 로컬 개발 인프라
# 실행: 저장소 루트에서 `just up` / `just down`
# 값은 루트 .env로 바꿀 수 있고, 없으면 아래 기본값을 쓴다 (로컬 전용 값).

name: proofgraph

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofgraph}
      POSTGRES_DB: ${POSTGRES_DB:-proofgraph}
    ports:
      # 127.0.0.1로 묶어 같은 네트워크의 다른 기기에서 접속하지 못하게 한다
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 컨테이너를 처음 만들 때만 실행된다 (데이터 볼륨이 비어 있을 때)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
